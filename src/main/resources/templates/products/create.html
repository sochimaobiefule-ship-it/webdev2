<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Product</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4" style="max-width: 600px;">
    <h2>Add New Product</h2>
    <form th:action="@{/products}" th:object="${product}" method="post" class="mt-3">
        <div class="mb-3">
            <label class="form-label">Product Name</label>
            <input type="text" th:field="*{name}" class="form-control" th:errorclass="is-invalid"/>
            <div class="invalid-feedback" th:errors="*{name}">Name Error</div>
        </div>
        <div class="mb-3">
            <label class="form-label">Category</label>
            <input type="text" th:field="*{category}" class="form-control" th:errorclass="is-invalid"/>
            <div class="invalid-feedback" th:errors="*{category}">Category Error</div>
        </div>
        <div class="mb-3">
            <label class="form-label">Price</label>
            <input type="number" step="0.01" th:field="*{price}" class="form-control" th:errorclass="is-invalid"/>
            <div class="invalid-feedback" th:errors="*{price}">Price Error</div>
        </div>
        <div class="mb-3">
            <label class="form-label">Stock Quantity</label>
            <input type="number" th:field="*{stock}" class="form-control" th:errorclass="is-invalid"/>
            <div class="invalid-feedback" th:errors="*{stock}">Stock Error</div>
        </div>
        <button type="submit" class="btn btn-success">Save Product</button>
        <a th:href="@{/products}" class="btn btn-secondary">Cancel</a>
    </form>
</body>
</html>
