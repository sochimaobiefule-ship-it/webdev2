<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Task</title>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 30px; 
        }
        .field { 
            margin-bottom: 15px; 
            width: 350px; 
        }
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
        }
        input[type="text"], 
        textarea {
            width: 100%; 
            padding: 6px; 
            box-sizing: border-box; 
        }
        .err { 
            color: red; 
            font-size: 0.85em; 
            margin-top: 3px; 
        }
        .btn { 
            padding: 6px 14px; 
            background: #28a745; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
        }
        .btn-cancel { 
            padding: 6px 14px; 
            background: #6c757d; 
            color: white; 
            text-decoration: none; 
            border-radius: 4px; 
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <h1>Create New Task</h1>
    <form th:action="@{/tasks}" th:object="${task}" method="post">
        <div class="field">
            <label for="title">Title:</label>
            <input type="text" id="title" th:field="*{title}" />
            <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="err">Title Error</div>
        </div>

        <div class="field">
            <label for="description">Description:</label>
            <textarea id="description" th:field="*{description}" rows="4"></textarea>
            <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="err">Description Error</div>
        </div>

        <div class="field">
            <label>
                <input type="checkbox" th:field="*{completed}" /> Marked as Completed
            </label>
        </div>
        <button type="submit" class="btn">Save Task</button>
        <a th:href="@{/tasks}" class="btn-cancel">Cancel</a>
    </form>
</body>
</html>
