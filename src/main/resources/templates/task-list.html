<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Tracker - All Tasks</title>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 30px; 
        }
        table { 
            border-collapse: collapse; 
            width: 100%; 
            margin-top: 15px; 
        }
        th, 
        td { 
            border: 1px solid #ccc; 
            padding: 10px; 
            text-align: left; 
        }
        th { 
            background: #f0f0f0; 
        }
        .btn { 
            padding: 6px 12px; 
            background: #007bff; 
            color: white; 
            text-decoration: none; 
            border-radius: 4px; 
        }
        .empty-msg { 
            color: #777; 
            font-style: italic; 
            margin-top: 15px; 
        }
        .done { 
            color: green; 
            font-weight: bold; 
        }
        .pending { 
            color: orange; 
            font-weight: bold; 
        }
    </style>
</head>
<body>
    <h1>Task Tracker</h1>
    <a th:href="@{/tasks/new}" class="btn">+ Add New Task</a>

    <div th:if="${#lists.isEmpty(tasks)}" class="empty-msg">
        <p>No tasks found. Click above to create one!</p>
    </div>

    <table th:if="${not #lists.isEmpty(tasks)}">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="t : ${tasks}">
                <td th:text="${t.id}">1</td>
                <td th:text="${t.title}">Sample Title</td>
                <td>
                    <span th:if="${t.completed}" class="done">Completed</span>
                    <span th:unless="${t.completed}" class="pending">Pending</span>
                </td>
                <td>
                    <a th:href="@{/tasks/{id}(id=${t.id})}">View Details</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
