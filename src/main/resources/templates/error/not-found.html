<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Task Not Found</title>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 40px; 
            text-align: center; 
        }
        .box { 
            border: 1px solid #f5c6cb; 
            background: #f8d7da; 
            color: #721c24; 
            padding: 25px; 
            border-radius: 6px; 
            display: inline-block;
            margin-top: 50px; 
        }
        .btn { 
            display: inline-block; 
            margin-top: 15px; 
            padding: 8px 16px; 
            background: #007bff; 
            color: white; 
            text-decoration: none; 
            border-radius: 4px; 
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Task Not Found</h2>
        <p th:text="${errorMessage}">Custom error message here</p>
        <a th:href="@{/tasks}" class="btn">Return to Task List</a>
    </div>
</body>
</html>
