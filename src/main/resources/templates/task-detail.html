<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Details</title>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 30px; 
        }
        .card { 
            border: 1px solid #ccc; 
            padding: 20px; 
            border-radius: 6px; 
            width: 400px; 
        }
        .btn { 
            display: inline-block; 
            margin-top: 15px; 
            padding: 6px 12px; 
            background: #6c757d; 
            color: white; 
            text-decoration: none; 
            border-radius: 4px; 
        }
    </style>
</head>
<body>
    <h1>Task Details</h1>
    <div class="card">
        <p><strong>ID:</strong> <span th:text="${task.id}">1</span></p>
        <p><strong>Title:</strong> <span th:text="${task.title}">Task Title</span></p>
        <p><strong>Description:</strong> 
           <span th:text="${task.description != null and !task.description.isBlank() ? task.description : 'No description provided'}"></span>
        </p>
        <p><strong>Status:</strong> 
           <span th:text="${task.completed ? 'Completed' : 'Pending'}">Pending</span>
        </p>
    </div>
    <a th:href="@{/tasks}" class="btn">Back to Task List</a>
</body>
</html>
