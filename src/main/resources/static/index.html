<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog — WEBDEV2 Week 13</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
            background-color: #f8f9fa;
        }

        h1,
        h2 {
            color: #333;
        }

        .status-box {
            font-weight: bold;
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }

        .loading {
            background-color: #e2e3e5;
            color: #383d41;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
        }

        .empty {
            background-color: #fff3cd;
            color: #856404;
        }

        ul#product-list {
            list-style-type: none;
            padding: 0;
            max-width: 500px;
        }

        ul#product-list li {
            background: #fff;
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }

        ul#product-list li:hover {
            background-color: #e9ecef;
        }

        .detail-panel {
            margin-top: 20px;
            padding: 15px;
            background: #fff;
            border: 1px solid #007bff;
            border-radius: 4px;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <h1>Product Management System</h1>
    <div id="status" class="status-box" style="display: none;"></div>

    <h2>Products List</h2>
    <ul id="product-list"></ul>

    <div id="detail-card" class="detail-panel" style="display: none;">
        <h2>Selected Product Details</h2>
        <div id="detail-content"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
