<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product Detail</title>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <h1>Product Details</h1>

    <div th:if="${product != null}">
        <p><strong>Name:</strong> <span th:text="${product.name}">Name</span></p>
        <p><strong>Price:</strong> $<span th:text="${product.price}">0.00</span></p>
        <p><strong>Category:</strong> <span th:text="${product.category != null ? product.category.name : 'N/A'}">Category</span></p>
    </div>

    <a th:href="@{/products}">Back to list</a>
</body>
</html>
